# Chọn 1 profile theo GPU của máy:
#   docker compose --profile nvidia up -d --build
#   docker compose --profile amd up -d --build
#   docker compose --profile cpu up -d --build
x-base: &base
  env_file: .env
  environment:
    DATA_DIR: /app/data
  ports:
    - "8000:8000"
  volumes:
    - models:/models
    - ./data:/app/data
  # XTTS worker là process riêng, giao tiếp qua shared memory
  shm_size: 2gb
  restart: unless-stopped

services:
  magician-nvidia:
    <<: *base
    profiles: [nvidia]
    build: { context: ., args: { TORCH_VARIANT: cu128, XTTS_TORCH_VARIANT: cu121 } }
    image: magician:cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  magician-amd:
    <<: *base
    profiles: [amd]
    # TheRock: ROCm chính thức AMD, torch 2.14, kernel native gfx1032 (RX 6600) — không cần HSA_OVERRIDE.
    # THEROCK_DEVICE đổi theo GPU: gfx1032=RX6600/6650, gfx1100=RX7900, ... hoặc device-all cho chắc.
    build:
      context: .
      args:
        TORCH_VARIANT: therock
        TORCH_VERSION: "2.14.0+rocm10.2.0"   # torchvision 0.29.0 (bản mới nhất) pin đúng torch 2.14.0
        TORCHVISION_VERSION: "0.29.0+rocm10.2.0"
        TORCHAUDIO_VERSION: "2.11.0.3+rocm10.2.0"
        THEROCK_DEVICE: device-gfx1032
        XTTS_TORCH_VARIANT: rocm6.2
    image: magician:rocm
    devices:
      - /dev/kfd
      - /dev/dri
    # không group_add: GID render/video khác nhau tùy máy host, docker-entrypoint.sh tự chỉnh lúc runtime
    security_opt:
      - seccomp=unconfined
    # Chỉ cần khi quay lại TORCH_VARIANT=rocm6.4 (torch 2.8 không build kernel cho gfx1032):
    # environment:
    #   HSA_OVERRIDE_GFX_VERSION: "10.3.0"

  magician-cpu:
    <<: *base
    profiles: [cpu]
    build: { context: ., args: { TORCH_VARIANT: cpu, XTTS_TORCH_VARIANT: cpu } }
    image: magician:cpu

volumes:
  models:
