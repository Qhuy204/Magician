# Danh mục policy quảng cáo TikTok dùng cho planner / rewrite / recheck.
# Nguồn: https://ads.tiktok.com/resources/help/article/tiktok-advertising-policies (đọc lại 11/2026).
# Đây là bản tóm tắt để ra quyết định sửa creative, không thay thế toàn văn policy.
#
# kind:
#   creative      sửa được trong video (lời thoại, chữ, hình, cắt)
#   conditional   ngành được phép có điều kiện (tuổi, khu vực, giấy phép, disclaimer): sửa creative + action_required
#   prohibited    phần lớn sản phẩm trong nhóm bị cấm: sản phẩm thuộc product_unfixable => unfixable
#   out_of_scope  vi phạm nằm ngoài video (landing page, giao hàng, tài khoản): chỉ action_required
# region_restricted: true => affected_regions của reason được gợi ý loại khỏi targeting
version: "2026-11"

